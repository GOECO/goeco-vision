<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOECO Vision — Đăng nhập</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border: none; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.10); max-width: 420px; width: 100%; }
    .logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #22c55e, #166534); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; }
    .form-control:focus { border-color: #22c55e; box-shadow: 0 0 0 .2rem rgba(34,197,94,.25); }
    .btn-login { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 10px; padding: 12px; font-weight: 600; letter-spacing: .3px; }
    .btn-login:hover { background: linear-gradient(135deg, #16a34a, #15803d); }
    .demo-account { background: #f8fafc; border-radius: 10px; border: 1px solid #e5e7eb; font-size: .82rem; cursor: pointer; transition: background .15s; }
    .demo-account:hover { background: #f0fdf4; border-color: #86efac; }
    #errorMsg { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="mx-auto login-card bg-white p-4 p-md-5">

    <div class="text-center mb-4">
      <div class="logo-icon mx-auto mb-3">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <h4 class="fw-bold mb-1">GO<span style="color:#166534">ECO</span> Vision</h4>
      <p class="text-muted small mb-0">Hệ thống quản lý giao nhận thông minh</p>
    </div>

    <div id="errorMsg" class="alert alert-danger py-2 small" role="alert">
      <i class="fa-solid fa-circle-exclamation me-1"></i>
      <span id="errorText">Sai tên đăng nhập hoặc mật khẩu.</span>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
          <input type="text" id="username" class="form-control" placeholder="admin, manager01, ..." autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" id="password" class="form-control" placeholder="••••••••">
          <button class="btn btn-outline-secondary" type="button" id="togglePwd">
            <i class="fa-solid fa-eye-slash fa-sm"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-success text-white w-100" id="submitBtn">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập
      </button>
    </form>

    <hr class="my-4">

    <p class="text-muted small text-center mb-2">Tài khoản demo — click để điền nhanh:</p>
    <div class="row g-2">
      <div class="col-6">
        <div class="demo-account p-2 text-center" onclick="fillDemo('admin','Admin@123')">
          <i class="fa-solid fa-shield-halved text-danger me-1"></i>
          <strong>admin</strong><br><span class="text-muted">Admin@123</span>
        </div>
      </div>
      <div class="col-6">
        <div class="demo-account p-2 text-center" onclick="fillDemo('manager01','Manager@123')">
          <i class="fa-solid fa-user-tie text-primary me-1"></i>
          <strong>manager01</strong><br><span class="text-muted">Manager@123</span>
        </div>
      </div>
      <div class="col-6">
        <div class="demo-account p-2 text-center" onclick="fillDemo('resident01','Resident@123')">
          <i class="fa-solid fa-house text-success me-1"></i>
          <strong>resident01</strong><br><span class="text-muted">Resident@123</span>
        </div>
      </div>
      <div class="col-6">
        <div class="demo-account p-2 text-center" onclick="fillDemo('shipper01','Shipper@123')">
          <i class="fa-solid fa-motorcycle text-warning me-1"></i>
          <strong>shipper01</strong><br><span class="text-muted">Shipper@123</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
function fillDemo(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('loginForm').dispatchEvent(new Event('submit'));
}

document.getElementById('togglePwd').addEventListener('click', function () {
  const pwd = document.getElementById('password');
  const icon = this.querySelector('i');
  if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fa-solid fa-eye fa-sm'; }
  else { pwd.type = 'password'; icon.className = 'fa-solid fa-eye-slash fa-sm'; }
});

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errDiv = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
  errDiv.style.display = 'none';

  try {
    const resp = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      document.getElementById('errorText').textContent = data.detail || 'Đăng nhập thất bại.';
      errDiv.style.display = 'block';
      return;
    }
    localStorage.setItem('goeco_token', data.access_token);
    localStorage.setItem('goeco_role', data.role);
    localStorage.setItem('goeco_name', data.full_name);
    window.location.href = '/dashboard';
  } catch (err) {
    document.getElementById('errorText').textContent = 'Lỗi kết nối server.';
    errDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập';
  }
});

// If already logged in, redirect
if (localStorage.getItem('goeco_token')) window.location.href = '/dashboard';
</script>
</body>
</html>
