[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "goeco-vision"
internalPort = 8000

[services.healthcheck]
path = "/health"
intervalSeconds = 30
timeoutSeconds = 10
