version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goeco
      POSTGRES_PASSWORD: goeco_secret
      POSTGRES_DB: goeco_vision
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goeco -d goeco_vision"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://goeco:goeco_secret@db:5432/goeco_vision
      JWT_SECRET: change_me_in_production
      YOLO_MODEL: yolov8n.pt
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.insightface

volumes:
  pg_data:
  model_cache:
