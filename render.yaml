services:
  - type: web
    name: goeco-vision
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goeco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: pserv
    name: goeco-vision-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: echo "worker placeholder"

databases:
  - name: goeco-db
    databaseName: goeco_vision
    user: goeco
